<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada · Mirla Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Archivo:wght@400;600&display=swap">
<style>
:root{--paper:#F7F3EC; --ink:#17150F; --ink-2:#5B5549; --pico-text:#A85608; color-scheme:light}
@media (prefers-color-scheme: dark){:root{--paper:#0F0E0B; --ink:#F2EEE5; --ink-2:#A9A294; --pico-text:#F2A03D; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.6 "Archivo","Helvetica Neue",Arial,sans-serif; padding:24px 16px}
main{max-width:560px}
h1{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:clamp(2.4rem,9vw,4.2rem); line-height:.98; letter-spacing:-.04em; margin:0 0 1rem}
h1 em{font-weight:400; color:var(--pico-text)}
p{color:var(--ink-2); margin:0 0 1.6rem}
a.btn{display:inline-block; background:var(--ink); color:var(--paper); text-decoration:none; font-weight:600; padding:.9rem 1.3rem; border-radius:999px}
</style>
</head>
<body>
<main>
  <h1>Este mirlo <em>se ha perdido.</em></h1>
  <p>La página que buscas no existe o ha cambiado de sitio.</p>
  <a class="btn" href="/">Volver a Mirla Studio →</a>
</main>
</body>
</html>
